name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bump package.json version and create the GitHub Release before building,
      # so the deployed site includes the new app version.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Build static site
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/en.html
          test -d out/_next
          test -f out/.htaccess
          test -f out/sitemap.xml
          test -f out/robots.txt

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './out/*'
          remote_path: './'
          sftp_only: true

      # `out/*` skips dotfiles; upload HTTPS redirect rules separately
      - name: Deploy .htaccess
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './out/.htaccess'
          remote_path: './.htaccess'
          sftp_only: true
